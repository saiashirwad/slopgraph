[package]
name = "slopgraph"
version = "0.1.0"
edition = "2021"
description = "Detect graph-shaped slop in a TypeScript program"
license = "MIT"
repository = "https://github.com/saiashirwad/slopgraph"

[dependencies]
clap = { version = "4", features = ["derive"] }
oxc = "0.146.0"
oxc_resolver = "11"
thiserror = "2"
walkdir = "2"
