[package]
name = "slopgraph"
version = "0.1.0"
edition = "2021"
description = "Detect graph-shaped slop in a TypeScript program"
license = "MIT"
repository = "https://github.com/saiashirwad/slopgraph"

[dependencies]
clap = { version = "4", features = ["derive"] }
oxc = { version = "0.146.0", features = ["ast_visit"] }
oxc_resolver = "11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
